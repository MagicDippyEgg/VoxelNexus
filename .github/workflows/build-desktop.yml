name: Build Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.4.1"

jobs:
  validate:
    name: Validate Project
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --editor --quit || true

  build:
    name: Build ${{ matrix.platform }}
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            preset: "Windows Desktop"
            output: build/voxelnexus_windows.exe
            runs-on: ubuntu-22.04
          - platform: Linux
            preset: "Linux/X11"
            output: build/voxelnexus_linux.x86_64
            runs-on: ubuntu-22.04
          - platform: macOS
            preset: "macOS"
            output: build/voxelnexus_macos.zip
            runs-on: macos-14
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --editor --quit || true

      - name: Export ${{ matrix.platform }}
        run: |
          mkdir -p build
          godot --headless --export-release "${{ matrix.preset }}" "${{ matrix.output }}"

      - name: Make Linux binary executable
        if: matrix.platform == 'Linux'
        run: chmod +x "${{ matrix.output }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxelnexus-${{ matrix.platform }}
          path: build/
          if-no-files-found: error
          retention-days: 30