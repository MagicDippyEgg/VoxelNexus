name: Release

on:
  push:
    tags:
      - "v*"

env:
  GODOT_VERSION: "4.4.1"

jobs:
  release:
    name: Release ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            preset: "Windows Desktop"
            output: build/voxelnexus_windows.exe
            runs-on: ubuntu-22.04
          - platform: Linux
            preset: "Linux/X11"
            output: build/voxelnexus_linux.x86_64
            runs-on: ubuntu-22.04
          - platform: macOS
            preset: "macOS"
            output: build/voxelnexus_macos.zip
            runs-on: macos-14
          - platform: Android
            preset: "Android"
            output: build/voxelnexus_android.apk
            runs-on: ubuntu-22.04
            android: true

    permissions:
      contents: write

    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - if: matrix.android == true
        name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - if: matrix.android == true
        name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - if: matrix.android == true
        name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - if: matrix.android == true
        name: Point Godot at the Android SDK
        shell: bash
        env:
          ANDROID_SDK: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/android_sdk_path = "$ANDROID_SDK"
          export/android/shutdown_adb_on_exit = true
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project
        run: godot --headless --editor --quit || true

      - name: Export ${{ matrix.platform }}
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --export-release "${{ matrix.preset }}" "${{ matrix.output }}"

      - name: Make Linux binary executable
        if: matrix.platform == 'Linux'
        run: chmod +x "${{ matrix.output }}"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.output }}
          generate_release_notes: true