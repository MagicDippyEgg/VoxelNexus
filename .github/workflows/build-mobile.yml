name: Build Mobile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.4.1"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Point Godot at the Android SDK
        shell: bash
        env:
          ANDROID_SDK: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/android_sdk_path = "$ANDROID_SDK"
          export/android/shutdown_adb_on_exit = true
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project
        run: godot --headless --editor --quit || true

      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --export-release "Android" "build/voxelnexus_android.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxelnexus-android
          path: build/
          if-no-files-found: error
          retention-days: 30

  # iOS export requires an Apple Developer code-signing identity and a
  # provisioning profile, which live in repo secrets. It is skipped until you:
  #   1. Add a repository variable ENABLE_IOS_BUILD = "true"
  #   2. Add the signing certificate + provisioning profile secrets
  #   3. Set application/code_sign_identity in export_presets.cfg
  build-ios:
    name: Build iOS
    if: vars.ENABLE_IOS_BUILD == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --editor --quit || true

      - name: Export iOS
        run: |
          mkdir -p build
          godot --headless --export-release "iOS" "build/voxelnexus_ios.tar.gz"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxelnexus-ios
          path: build/
          if-no-files-found: error
          retention-days: 30